<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKEA — 3D assembly</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#141414;--paper:#f7f6f3;--muted:#6b6b6b;--hl:#e6502e;
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
    /* one spacing scale for every section of the page */
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
    --pad:28px;          /* shared horizontal inset for topbar / legend / caption / bar */
    --btn:44px;--icon:19px;--r:24px;
    --dial:clamp(150px,min(26vw,40vh),320px);
    accent-color:var(--hl);
  }
  @media (max-width:640px){:root{--pad:16px;--btn:40px;--icon:18px;--r:18px;--s5:18px;--dial:clamp(130px,min(40vw,26vh),180px)}}
  ::selection{background:var(--hl);color:#fff}
  :focus-visible{outline:3px solid var(--hl);outline-offset:2px}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  body{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(10px,2vw,26px)}
  .page{width:100%;max-width:1120px;max-height:100%;margin:auto;display:flex;flex-direction:column;background:#fff;border:2px solid var(--ink);border-radius:var(--r);position:relative;overflow:hidden}
  .page::before{content:"";position:absolute;inset:9px;border:1.5px dashed rgba(20,20,20,.35);border-radius:calc(var(--r) - 8px);pointer-events:none;z-index:2}
  .topbar{flex:none;position:relative;z-index:12;display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3);padding:var(--s5) var(--pad) var(--s2)}
  .topbar a.menu{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:20px;padding:4px 12px;background:#fff}
  .topbar a.menu svg{width:14px;height:14px}
  .topbar a.menu:hover{background:#f0efe9}
  .topbar .title{font-size:14px;font-weight:800;letter-spacing:.5px}
  .sel{position:relative;margin-left:auto}
  .selbtn{display:inline-flex;align-items:center;gap:var(--s2);font-family:inherit;font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:20px;padding:7px 14px;cursor:pointer;white-space:nowrap}
  .selbtn:hover{background:#f0efe9}
  .selbtn svg{width:14px;height:14px;transition:transform .18s}
  .sel.open .selbtn svg{transform:rotate(180deg)}
  .selmenu{position:absolute;top:calc(100% + var(--s2));right:0;z-index:13;min-width:100%;display:flex;flex-direction:column;gap:2px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.16)}
  .selmenu[hidden]{display:none}
  .selmenu button{display:block;width:100%;font-family:inherit;font-size:12px;font-weight:700;color:var(--ink);background:none;border:0;border-radius:11px;padding:9px 14px;cursor:pointer;text-align:left;white-space:nowrap}
  .selmenu button:hover{background:#f0efe9}
  .selmenu button[aria-selected=true]{background:var(--ink);color:#fff}
  .view{position:relative;overflow:hidden;flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
  .stepno{position:absolute;top:var(--s3);left:var(--pad);z-index:6;display:flex;align-items:baseline;gap:var(--s1);font-size:clamp(30px,4.6vw,48px);font-weight:800;letter-spacing:-2px;line-height:1}
  .stepno small{font-size:15px;font-weight:700;letter-spacing:0;color:var(--muted)}
  #stage{flex:1 1 auto;display:block;width:100%;height:clamp(380px,68vh,780px);min-height:0;touch-action:none;cursor:grab}
  #stage:active{cursor:grabbing}
  #inset{position:absolute;top:var(--s3);right:var(--pad);width:var(--dial);height:var(--dial);z-index:5;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.18)}
  #detailtag{position:absolute;top:var(--s3);right:var(--pad);width:var(--dial);height:var(--dial);z-index:6;pointer-events:none}
  #detailtag b{position:absolute;top:var(--s2);left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted);background:#fff;border:1px solid rgba(20,20,20,.25);border-radius:20px;padding:1px 9px}
  #detailtag .cnt{position:absolute;bottom:var(--s2);left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;color:var(--ink);background:rgba(255,255,255,.9);border-radius:8px;padding:0 8px;white-space:nowrap}
  #leads{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:visible}
  #legend{flex:none;position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:var(--s2);padding:var(--s3) var(--pad) 0;overflow-y:auto;overscroll-behavior:contain}
  .chip{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:#fff;border:1px solid rgba(20,20,20,.5);border-radius:7px;padding:2px 9px;line-height:1.5;width:max-content;max-width:min(260px,60vw)}
  /* part tags float up-left of their item so the items behind stay visible */
  .chip.tray{position:absolute;transform:translate(-100%,-100%);background:rgba(255,255,255,.88);z-index:5}
  .chip .q{font-weight:800}
  .chip code{font-family:inherit;color:var(--muted);font-weight:600}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--hl);flex:0 0 auto}
  .cap{flex:none;position:relative;z-index:5;padding:var(--s3) var(--pad) 0;min-height:58px}
  .cap .name{font-size:16px;font-weight:700}
  .cap .txt{font-size:13px;color:var(--muted);line-height:1.5;margin-top:var(--s1)}
  .bar{flex:none;position:relative;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3);padding:var(--s3) var(--pad) var(--s5)}
  .bar .group{display:flex;align-items:center;gap:var(--s2);flex:0 0 auto}
  button.nav{width:var(--btn);height:var(--btn);padding:0;border:2px solid var(--ink);background:#fff;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;color:var(--ink);flex:0 0 auto}
  button.nav svg{width:var(--icon);height:var(--icon)}
  button.nav:hover{background:#f0efe9}
  button.nav:active{transform:scale(.94)}
  button.nav:disabled{opacity:.28;cursor:default}
  button.nav.active{background:var(--ink);color:#fff}
  button.nav:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
  /* step ruler */
  .track{position:relative;flex:1 1 220px;min-width:150px;height:var(--btn);border:2px solid var(--ink);border-radius:13px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s3);cursor:pointer}
  .track:focus-within{outline:3px solid var(--hl);outline-offset:2px}
  .track .fill{position:absolute;left:0;top:0;bottom:0;background:#f0efe9}
  .track .ticks{position:absolute;left:0;right:0;bottom:0;height:9px;background:repeating-linear-gradient(90deg,rgba(20,20,20,.32) 0 1px,transparent 1px calc(100% / var(--steps,48)))}
  .track .head{position:absolute;top:5px;bottom:5px;width:5px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
  .track .lbl,.track .val{position:relative;font-size:12px;font-weight:700;pointer-events:none}
  .track .lbl{color:var(--muted)}
  .track .val{font-weight:800;font-variant-numeric:tabular-nums}
  .track input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  /* hover tooltips */
  .tip{position:relative}
  .tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(3px);background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.2px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;z-index:9}
  .tip::before{content:"";position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);opacity:0;transition:opacity .12s;z-index:9}
  .tip:hover::after,.tip:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0);transition-delay:.2s}
  .tip:hover::before,.tip:focus-visible::before{opacity:1;transition-delay:.2s}
  .tip.start::after{left:0;transform:translateY(3px)}
  .tip.start:hover::after,.tip.start:focus-visible::after{transform:translateY(0);transition-delay:.2s}
  .tip.end::after{left:auto;right:0;transform:translateY(3px)}
  .tip.end:hover::after,.tip.end:focus-visible::after{transform:translateY(0);transition-delay:.2s}
  @media (max-width:640px){
    #stage{height:clamp(320px,52vh,520px)}
    .topbar .title{display:none}
    .bar .track{order:-1;flex:1 0 100%}
    .bar .steps{margin-left:auto}
  }
  body.partslist .view{flex:0 0 clamp(200px,32vh,320px)}
  body.partslist #legend{flex:1 1 auto}
  body.nolabels #legend{display:none}
  body.nolabels #detailtag .cnt{display:none}
  .hint{position:absolute;left:var(--pad);bottom:var(--s3);z-index:7;font-size:11px;color:#b3b3ad;pointer-events:none}
  @media (max-width:640px){.hint{display:none}}
  /* encouraging IKEA guy — slides in from the left edge, half cut off */
  #buddy{position:absolute;left:0;top:50%;z-index:8;width:clamp(130px,17vw,200px);pointer-events:none;transform:translate(-135%,-50%);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
  #buddy.show{transform:translate(-18%,-50%)}
  #buddy.big{width:clamp(160px,22vw,250px)}
  #buddy.big.show{transform:translate(-10%,-50%)}
  #buddy .guy{width:100%;transform-origin:50% 100%;animation:wiggle 1.9s ease-in-out infinite}
  #buddy .guy svg{display:block;width:100%;height:auto}
  /* the bubble sits to his right, so it has to fade rather than ride off the edge with him */
  #buddy .speech{position:absolute;left:100%;top:var(--s2);margin-left:var(--s3);width:max-content;max-width:min(190px,42vw);background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:7px 11px;font-size:13px;font-weight:700;line-height:1.25;box-shadow:0 5px 16px rgba(0,0,0,.14);opacity:0;transition:opacity .2s}
  #buddy.show .speech{opacity:1;transition:opacity .3s .25s}
  #buddy .speech::after{content:"";position:absolute;left:-16px;top:14px;border:8px solid transparent;border-right-color:var(--ink)}
  #buddy .speech::before{content:"";position:absolute;left:-11px;top:16px;border:6px solid transparent;border-right-color:#fff;z-index:1}
  @media (max-width:640px){#buddy{width:clamp(92px,26vw,124px)}#buddy.big{width:clamp(112px,32vw,152px)}#buddy .speech{font-size:11px;padding:6px 9px}}
  @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  /* finish celebration */
  #confetti{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
  #confetti i{position:absolute;top:-20px;left:var(--x);animation:cx var(--t) ease-in-out forwards}
  #confetti b{display:block;width:var(--w);height:var(--h);border-radius:1px;background:var(--c);animation:cy var(--t) linear forwards,cfade var(--t) linear forwards}
  @keyframes cx{to{transform:translateX(var(--dx))}}
  @keyframes cy{to{transform:translateY(var(--dy)) rotate(var(--rot))}}
  @keyframes cfade{0%,80%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){#buddy .guy{animation:none}#buddy{transition:none}}
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="menu" href="index.html" id="menulink">Menu</a>
      <span class="title" id="title">—</span>
      <div class="sel" id="sel">
        <button class="selbtn" id="selbtn" aria-haspopup="listbox" aria-expanded="false"><span id="sellabel">BRIMNES bed frame</span></button>
        <div class="selmenu" id="selmenu" role="listbox" aria-label="Choose a product" hidden>
          <button role="option" data-model="brimnes" aria-selected="true">BRIMNES bed frame</button>
          <button role="option" data-model="lack" aria-selected="false">LACK coffee table</button>
        </div>
      </div>
    </div>
    <div class="view">
      <div class="stepno" id="stepno">Parts</div>
      <canvas id="stage"></canvas>
      <svg id="leads"><line id="lead" stroke="#141414" stroke-width="1.5" stroke-dasharray="4 3" x1="0" y1="0" x2="0" y2="0"/><circle id="target" r="7" fill="none" stroke="#e6502e" stroke-width="2" cx="-40" cy="-40"/></svg>
      <canvas id="inset"></canvas>
      <div id="detailtag"><b>DETAIL</b><span class="cnt" id="cnt"></span></div>
      <div id="buddy"><div class="speech" id="speech"></div><div class="guy" id="guy"></div></div>
      <div id="confetti"></div>
      <div class="hint">drag to rotate · scroll or pinch to zoom</div>
    </div>
    <div id="legend"></div>
    <div class="cap">
      <div class="name" id="cname"></div>
      <div class="txt" id="ctxt"></div>
    </div>
    <div class="bar">
      <div class="group tools">
        <button class="nav tip start" id="play" aria-label="Play" data-tip="Play through the steps"></button>
        <button class="nav tip active" id="detail" aria-label="Toggle close-up" data-tip="Close-up detail: on"></button>
        <button class="nav tip active" id="labels" aria-label="Toggle item labels" data-tip="Item labels: on"></button>
      </div>
      <div class="track" id="track">
        <div class="fill" id="sfill"></div>
        <div class="ticks"></div>
        <span class="lbl">Step</span>
        <span class="val" id="sval">Parts</span>
        <div class="head" id="shead"></div>
        <input type="range" id="slider" min="0" max="48" value="0" step="1" aria-label="Step">
      </div>
      <div class="group steps">
        <button class="nav tip" id="prev" aria-label="Previous step" data-tip="Previous step"></button>
        <button class="nav tip end" id="next" aria-label="Next step" data-tip="Next step"></button>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COMPACT=matchMedia('(max-width:640px)');
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const UP=V(0,1,0),ZAX=V(0,0,1);
const A=(a,b,n)=>{if(n<=1)return[(a+b)/2];const o=[];for(let i=0;i<n;i++)o.push(a+(b-a)*i/(n-1));return o;};
const mk=(px,py,pz,dx,dy,dz)=>({pos:[px,py,pz],dir:[dx,dy,dz]});

// Lucide icon paths (lucide.dev) — inlined so the UI works offline
const ICON={
  'arrow-left':'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  'arrow-right':'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  pause:'<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  'zoom-in':'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/>',
  tag:'<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>',
  'layout-grid':'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  'chevron-down':'<path d="m6 9 6 6 6-6"/>'
};
const icon=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';

// ---------- shared render setup ----------
const canvas=document.getElementById('stage'),insetC=document.getElementById('inset');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const insetR=new THREE.WebGLRenderer({canvas:insetC,antialias:true,alpha:true});insetR.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const content=new THREE.Group();scene.add(content);
const tray=new THREE.Group();scene.add(tray);tray.visible=false;
const fitGroup=new THREE.Group();scene.add(fitGroup);

const faceMat=new THREE.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
const darkMat=new THREE.MeshBasicMaterial({color:0x141414});
const hlMat=new THREE.MeshBasicMaterial({color:0xe6502e});
const lineMat=new THREE.LineBasicMaterial({color:0x141414});
function box(w,h,d){const g=new THREE.Group();const geo=new THREE.BoxGeometry(w,h,d);g.add(new THREE.Mesh(geo,faceMat));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),lineMat));return g;}
function cyl(r,h,s){const g=new THREE.Group();const geo=new THREE.CylinderGeometry(r,r,h,s||16);g.add(new THREE.Mesh(geo,faceMat));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,25),lineMat));return g;}
function makeFit(kind){
  if(kind==='screw'){const g=new THREE.Group();g.add(cyl(0.11,1.3,12));const hd=cyl(0.26,0.16,14);hd.position.y=0.73;g.add(hd);return g;}
  if(kind==='longscrew'){const g=new THREE.Group();g.add(cyl(0.12,2.6,12));return g;}
  if(kind==='bolt'){const g=new THREE.Group();g.add(cyl(0.14,1.5,12));const hd=cyl(0.3,0.18,14);hd.position.y=0.8;g.add(hd);return g;}
  if(kind==='dowel')return cyl(0.16,1.2,12);
  if(kind==='cam'){const g=new THREE.Group();g.add(cyl(0.5,0.42,20));const slot=box(0.12,0.06,0.7);slot.position.y=0.22;slot.children[0].material=darkMat;g.add(slot);return g;}
  if(kind==='cap')return box(0.6,0.5,0.28);
  if(kind==='cube')return box(0.7,0.7,0.7);
  if(kind==='rail')return box(0.4,0.5,3.6);
  if(kind==='ring')return cyl(0.4,0.2,20);
  if(kind==='allen'){const g=new THREE.Group();const a=box(0.3,0.3,3);const b=box(0.3,1.8,0.3);b.position.set(0,-0.9,1.5);g.add(a,b);return g;}
  if(kind==='lbracket'){const g=new THREE.Group();const a=box(0.75,0.14,0.55),b=box(0.14,0.75,0.55);a.position.set(0,-0.3,0);b.position.set(-0.3,0.06,0);g.add(a,b);return g;}
  if(kind==='panel')return box(3,1.4,0.22);
  return box(0.6,0.6,0.6);
}

// ================= MODEL: BRIMNES =================
function buildBrimnes(){
  const P={};
  const W=16,L=21,H=4,t=0.5;
  function reg(key,obj,size,pos,name){obj.position.set(pos[0],pos[1],pos[2]);obj.visible=false;content.add(obj);P[key]={obj,size,pos:V(pos[0],pos[1],pos[2]),name};}
  reg('CL',box(t,H,L-1),[t,H,L-1],[-2.4,H/2,0],'Centre panel CL');
  reg('CR',box(t,H,L-1),[t,H,L-1],[2.4,H/2,0],'Centre panel CR');
  reg('sideL',box(t,H,L),[t,H,L],[-W/2+t/2,H/2,0],'Side panel (L)');
  reg('sideR',box(t,H,L),[t,H,L],[W/2-t/2,H/2,0],'Side panel (R)');
  reg('endHead',box(W,H,t),[W,H,t],[0,H/2,-L/2+t/2],'Head panel');
  reg('endFoot',box(W,H,t),[W,H,t],[0,H/2,L/2-t/2],'Foot panel');
  reg('runnerCL',box(0.35,0.5,L-3),[0.35,0.5,L-3],[-2.0,H*0.7,0],'Runner 139505');
  reg('runnerCR',box(0.35,0.5,L-3),[0.35,0.5,L-3],[2.0,H*0.7,0],'Runner 139505');
  reg('runL',box(0.35,0.5,L-3),[0.35,0.5,L-3],[-W/2+1,H*0.7,0],'Runner 139505');
  reg('runR',box(0.35,0.5,L-3),[0.35,0.5,L-3],[W/2-1,H*0.7,0],'Runner 139505');
  reg('brk1',box(0.4,1.6,1.6),[0.4,1.6,1.6],[-W/2+0.3,1.6,-L/4],'Bracket 121370');
  reg('brk2',box(2.4,2.4,0.5),[2.4,2.4,0.5],[0,2.4,-L/2+0.4],'Corner bracket 116791');
  reg('railBack',box(W-2*t,0.6,0.8),[W-2*t,0.6,0.8],[0,H+0.3,-L/2+2.6],'Support rail 117228');
  reg('railFront',box(W-2*t,0.6,0.8),[W-2*t,0.6,0.8],[0,H+0.3,L/2-2.6],'Support rail 118301');
  reg('beam',box(0.9,0.9,L-3),[0.9,0.9,L-3],[0,H+0.1,0],'Centre support beam');
  // slats: children RELATIVE to group, group anchored at rest height (fixes floating/offset)
  const slatY=H+0.75;
  const slatsA=new THREE.Group(),slatsB=new THREE.Group();content.add(slatsA,slatsB);slatsA.visible=slatsB.visible=false;

function positionTrayLabels(){

canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(userZoom*(e.deltaY>0?0.9:1.1));},{passive:false});
addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName))return;
  if(e.key==='Escape'){openSel(false);return;}
  if(e.key==='ArrowLeft')go(idx-1);else if(e.key==='ArrowRight')go(idx+1);
});

let modelKey=new URLSearchParams(location.search).get('model')==='lack'?'lack':'brimnes';
resize();loadModel(modelKey);loop();
</script>
</body>
</html>
