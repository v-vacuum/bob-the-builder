<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKEA — 3D assembly</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#141414;--paper:#f7f6f3;--muted:#6b6b6b;--hl:#e6502e;--font:"Helvetica Neue",Helvetica,Arial,sans-serif}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .page{width:100%;max-width:900px;background:#fff;border:2px solid var(--ink);border-radius:22px;position:relative;overflow:hidden}
  .page::before{content:"";position:absolute;inset:9px;border:1.5px dashed rgba(20,20,20,.35);border-radius:15px;pointer-events:none;z-index:2}
  .topbar{position:relative;z-index:6;display:flex;align-items:center;gap:12px;padding:12px 20px 2px}
  .topbar a.menu{font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:20px;padding:3px 12px;background:#fff}
  .topbar a.menu:hover{background:#f0efe9}
  .topbar .title{font-size:14px;font-weight:800;letter-spacing:.5px}
  .topbar select{margin-left:auto;font-family:inherit;font-size:12px;font-weight:600;border:2px solid var(--ink);border-radius:20px;padding:3px 10px;background:#fff;cursor:pointer}
  .stepno{position:absolute;top:44px;left:20px;z-index:6;font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1}
  .stepno small{font-size:15px;font-weight:700;letter-spacing:0;color:var(--muted);margin-left:4px}
  /* The leader line, the target ring and the parts tags are all computed in canvas
     coordinates, so the box they are positioned against has to be the canvas box. */
  .view{position:relative;overflow:hidden}
  #stage{display:block;width:100%;height:500px;touch-action:none;cursor:grab}
  #stage:active{cursor:grabbing}
  #inset{position:absolute;top:52px;right:16px;width:230px;height:230px;z-index:5;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.18)}
  #detailtag{position:absolute;top:52px;right:16px;width:230px;height:230px;z-index:6;pointer-events:none}
  #detailtag b{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted);background:#fff;border:1px solid rgba(20,20,20,.25);border-radius:20px;padding:1px 9px}
  #detailtag .cnt{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;color:var(--ink);background:rgba(255,255,255,.9);border-radius:8px;padding:0 8px;white-space:nowrap}
  #leads{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:visible}
  #legend{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:6px;padding:10px 24px 0}
  #legend:empty{padding:0}
  .chip{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:#fff;border:1px solid rgba(20,20,20,.5);border-radius:7px;padding:2px 9px;line-height:1.5;width:max-content}
  .chip .q{font-weight:800}
  .chip code{font-family:inherit;color:var(--muted);font-weight:600}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--hl);flex:0 0 auto}
  /* parts-screen tags: shown only where one fits, so the layout stays readable */
  .chip.tag{pointer-events:none;padding:2px 9px 2px 7px;gap:7px;border-radius:8px;border-color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);white-space:nowrap}
  .chip.tag .tdot{width:7px;height:7px;border-radius:50%;background:var(--hl);flex:0 0 auto}
  .cap{position:relative;z-index:5;padding:2px 26px 6px;min-height:56px}
  .cap .name{font-size:16px;font-weight:700}
  .cap .txt{font-size:13px;color:var(--muted);line-height:1.5;margin-top:2px}
  .bar{position:relative;z-index:5;display:flex;align-items:center;gap:11px;padding:6px 22px 16px}
  button.nav{width:40px;height:40px;border:2px solid var(--ink);background:#fff;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;color:var(--ink);flex:0 0 auto}
  button.nav:hover{background:#f0efe9}
  button.nav:active{transform:scale(.94)}
  button.nav:disabled{opacity:.28;cursor:default}
  .slidewrap{flex:1;display:flex;align-items:center;gap:10px}
  input[type=range]{flex:1;accent-color:#141414}
  .spin.active,.detail.active,.labels.active{background:var(--ink);color:#fff}
  body.nolabels #legend{display:none}
  body.nolabels #detailtag .cnt{display:none}
  .hint{position:absolute;bottom:6px;right:16px;z-index:7;font-size:11px;color:#b3b3ad}
  /* encouraging IKEA guy */
  #buddy{position:absolute;right:12px;bottom:6px;z-index:8;width:118px;pointer-events:none;transform:translateX(150%);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
  #buddy.show{transform:translateX(0)}
  #buddy.big{width:168px;right:36px}
  #buddy .guy{width:100%;transform-origin:50% 100%;animation:wiggle 1.9s ease-in-out infinite}
  #buddy .guy svg{display:block;width:100%;height:auto}
  #buddy .speech{position:absolute;right:82px;bottom:118px;width:154px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:7px 11px;font-size:13px;font-weight:700;line-height:1.25;box-shadow:0 5px 16px rgba(0,0,0,.14)}
  #buddy.big .speech{bottom:170px;right:120px}
  #buddy .speech::after{content:"";position:absolute;right:-16px;bottom:14px;border:8px solid transparent;border-left-color:var(--ink)}
  #buddy .speech::before{content:"";position:absolute;right:-11px;bottom:16px;border:6px solid transparent;border-left-color:#fff;z-index:1}
  @keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  @media (prefers-reduced-motion: reduce){#buddy .guy{animation:none}#buddy{transition:none}}
  @media (max-width:600px){#buddy{width:88px}#buddy .speech{right:66px;bottom:92px;width:120px;font-size:11px}#legend{padding:8px 16px 0}}
  @media (max-width:600px){#stage{height:400px}.stepno{font-size:34px}#inset,#detailtag{width:150px;height:150px}#legend{max-width:48%}}
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="menu" href="index.html">&#8592; Menu</a>
      <span class="title" id="title">—</span>
      <select id="modelsel"><option value="brimnes">BRIMNES bed frame</option><option value="lack">LACK coffee table</option></select>
    </div>
    <div class="stepno" id="stepno">Parts</div>
    <div class="view">
      <canvas id="stage"></canvas>
      <svg id="leads"><line id="lead" stroke="#141414" stroke-width="1.5" stroke-dasharray="4 3" x1="0" y1="0" x2="0" y2="0"/><circle id="target" r="7" fill="none" stroke="#e6502e" stroke-width="2" cx="-40" cy="-40"/></svg>
      <canvas id="inset"></canvas>
      <div id="detailtag"><b id="detaillabel">DETAIL</b><span class="cnt" id="cnt"></span></div>
      <div id="buddy"><div class="speech" id="speech"></div><div class="guy" id="guy"></div></div>
    </div>
    <div id="legend"></div>
    <div class="cap">
      <div class="name" id="cname"></div>
      <div class="txt" id="ctxt"></div>
    </div>
    <div class="bar">
      <button class="nav" id="prev" aria-label="Previous">&#8592;</button>
      <div class="slidewrap"><input type="range" id="slider" min="0" max="48" value="0" step="1" aria-label="Step"></div>
      <button class="nav detail active" id="detail" aria-label="Toggle close-up" title="Close-up detail (on)">&#128269;</button>
      <button class="nav labels active" id="labels" aria-label="Toggle item labels" title="Item labels (on)">&#127991;</button>
      <button class="nav spin" id="spin" aria-label="Toggle spin" title="Auto-spin (off)">&#8635;</button>
      <button class="nav" id="play" aria-label="Play">&#9658;</button>
      <button class="nav" id="next" aria-label="Next">&#8594;</button>
    </div>
    <div class="hint">drag to rotate · scroll to zoom</div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const UP=V(0,1,0),ZAX=V(0,0,1);
const A=(a,b,n)=>{if(n<=1)return[(a+b)/2];const o=[];for(let i=0;i<n;i++)o.push(a+(b-a)*i/(n-1));return o;};
const mk=(px,py,pz,dx,dy,dz)=>({pos:[px,py,pz],dir:[dx,dy,dz]});

// ---------- shared render setup ----------
const canvas=document.getElementById('stage'),insetC=document.getElementById('inset');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const insetR=new THREE.WebGLRenderer({canvas:insetC,antialias:true,alpha:true});insetR.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const content=new THREE.Group();scene.add(content);
const tray=new THREE.Group();scene.add(tray);tray.visible=false;
const fitGroup=new THREE.Group();scene.add(fitGroup);

const faceMat=new THREE.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
const darkMat=new THREE.MeshBasicMaterial({color:0x141414});
// DoubleSide: the target ring is oriented along the insertion axis, so a single-sided
// material is back-face culled for every fastener driven away from the camera.
const hlMat=new THREE.MeshBasicMaterial({color:0xe6502e,side:THREE.DoubleSide});
const holeMat=new THREE.MeshBasicMaterial({color:0x141414,side:THREE.DoubleSide,transparent:true,opacity:.8,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
const lineMat=new THREE.LineBasicMaterial({color:0x141414});
// LACK is modelled at true scale: 1 world unit = 50 mm, so its fittings carry real
// millimetre sizes while the BRIMNES shapes keep their original stylised ones.
const MM=1/50;
// per-kind radius of the pilot hole drawn at the target point, and the length the
// fitting occupies along its insertion axis (used to park the arrow clear of the head)
const HOLE_R={dowel:.17,screw:.13,longscrew:.13,bolt:.16,cam:.45,bigcam:.62,drawercam:.46,cap:.3,cube:.22,sleeve:.22,ring:.2,allen:.5,rail:.14,panel:.14,
  s115980:3.4*MM,s108530:2.8*MM,s109041:2.4*MM,b120298:2.8*MM,awl:2.4*MM};
const FIT_LEN={screw:1.6,longscrew:2.9,bolt:1.75,dowel:.9,cam:.95,bigcam:1.1,drawercam:.8,cap:.55,cube:.75,sleeve:.7,rail:.75,ring:.6,allen:1.2,lbracket:.8,panel:1.0,
  s115980:63*MM,s108530:22*MM,s109041:15*MM,b120298:20*MM,awl:150*MM};
const fitLen=k=>FIT_LEN[k]||1.3;
const SPIN={screw:1,longscrew:1,bolt:1,s115980:1,s108530:1,s109041:1};  // driven fasteners: continuous rotation
const LOCK={cam:1,bigcam:1,drawercam:1,allen:1};                     // cams: a quarter-turn once seated
function box(w,h,d){const g=new THREE.Group();const geo=new THREE.BoxGeometry(w,h,d);g.add(new THREE.Mesh(geo,faceMat));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),lineMat));return g;}
function cyl(r,h,s){const g=new THREE.Group();const geo=new THREE.CylinderGeometry(r,r,h,s||16);g.add(new THREE.Mesh(geo,faceMat));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,25),lineMat));return g;}
function taper(rt,rb,h,s){const g=new THREE.Group();const geo=new THREE.CylinderGeometry(rt,rb,h,s||14);g.add(new THREE.Mesh(geo,faceMat));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,25),lineMat));return g;}
// The LACK fittings below are built from dimensions measured off the 1:1 fittings
// page of AA-472482-3.
function darken(g){g.children[0].material=darkMat;return g;}
// Pan-head Pozidriv wood screw, centred on the origin, tip at -Y so the engine can
// drop it straight down its insertion axis.
function panScrew(L,r,hr,hh){
  const g=new THREE.Group();
  const shank=cyl(r,L-hh,14);shank.position.y=-hh/2;g.add(shank);
  const head=cyl(hr,hh,20);head.position.y=L/2-hh/2;g.add(head);
  const tip=new THREE.Mesh(new THREE.CylinderGeometry(r,0,r*2.4,14),faceMat);tip.position.y=-L/2+r*1.2;g.add(tip);
  const a=darken(box(hr*1.5,hh*0.4,hr*0.3)),b=darken(box(hr*0.3,hh*0.4,hr*1.5));
  a.position.y=b.position.y=L/2;g.add(a,b);
  return g;
}
// Double-ended dowel screw: wood thread and a point at both ends, collar at the middle.
function dblScrew(L,r,cr){
  const g=new THREE.Group();
  g.add(cyl(r,L*0.84,14));
  const t1=new THREE.Mesh(new THREE.CylinderGeometry(r,0,L*0.1,14),faceMat);t1.position.y=-L/2+L*0.05;
  const t2=new THREE.Mesh(new THREE.CylinderGeometry(0,r,L*0.1,14),faceMat);t2.position.y=L/2-L*0.05;
  g.add(t1,t2,cyl(cr,L*0.04,20));
  return g;
}
// Angle bracket 120298. Origin sits at the top of the shelf-bearing arm, on the face
// that lies against the leg: +Y is up, +Z points away from the leg into the table.
function bracket120298(){
  const g=new THREE.Group();
  const rib=box(20*MM,2.5*MM,20*MM);rib.position.set(0,-1.25*MM,10*MM);
  const tab=box(18*MM,14*MM,2.5*MM);tab.position.set(0,-9.5*MM,1.25*MM);
  const slot=darken(box(5*MM,3.5*MM,11*MM));slot.position.set(0,-1.25*MM,11*MM);
  const hole=darken(box(5*MM,5*MM,3.5*MM));hole.position.set(0,-9.5*MM,1.25*MM);
  g.add(rib,tab,slot,hole);
  return g;
}
// Marking template 120938. Origin at the hooked end, long axis +Y, lying on the z=0 face.
const TMPL_LEN=235*MM,TMPL_MARK=220.5*MM;
function template120938(){
  const g=new THREE.Group();
  const W=26*MM,T=4*MM;
  const bar=box(W,TMPL_LEN,T);bar.position.set(0,TMPL_LEN/2,T/2);
  const lip=box(W,T,12*MM);lip.position.set(0,T/2,-6*MM+T);
  g.add(bar,lip);
  [0.30,0.52,0.74].forEach(f=>{const c=darken(box(13*MM,26*MM,T*1.4));c.position.set(0,TMPL_LEN*f,T/2);g.add(c);});
  const dot=darken(cyl(2.2*MM,T*1.6,12));dot.rotation.x=Math.PI/2;dot.position.set(0,TMPL_MARK,T/2);g.add(dot);
  return g;
}
function makeFit(kind){
  if(kind==='s115980')return dblScrew(63*MM,3*MM,5.5*MM);
  if(kind==='s108530')return panScrew(22*MM,2.5*MM,4.5*MM,3*MM);
  if(kind==='s109041')return panScrew(15*MM,2.1*MM,4*MM,2.6*MM);
  if(kind==='b120298')return bracket120298();
  if(kind==='t120938')return template120938();
  // Tools. Smooth parts need >=16 segments: at 12 the facet angle clears the edge
  // threshold and the shaft comes out ribbed, which reads as a thread.
  if(kind==='awl'||kind==='driver'){
    const d=kind==='driver';
    const L=(d?200:162)*MM;
    const parts=d
      ?[[taper(7*MM,12.5*MM,10*MM,12),10],[cyl(12.5*MM,76*MM,12),76],[taper(12.5*MM,7*MM,14*MM,12),14],
        [cyl(4.5*MM,14*MM,12),14],[cyl(3*MM,74*MM,12),74],[taper(3*MM,1.3*MM,12*MM,12),12]]
      :[[taper(6.5*MM,10.5*MM,9*MM,12),9],[cyl(10.5*MM,58*MM,12),58],[taper(10.5*MM,6*MM,11*MM,12),11],
        [cyl(4*MM,10*MM,12),10],[cyl(1.9*MM,46*MM,12),46],[taper(1.9*MM,0.15*MM,28*MM,12),28]];
    const g=new THREE.Group();let y=L/2;
    parts.forEach(([m,hh])=>{m.position.y=y-hh*MM/2;y-=hh*MM;g.add(m);});
    return g;}
  if(kind==='hammer'){
    const g=new THREE.Group(),L=330*MM,top=L/2;
    const handle=taper(11*MM,9*MM,290*MM,12);handle.position.y=-L/2+145*MM;
    const butt=taper(14.5*MM,11.5*MM,18*MM,12);butt.position.y=-L/2+9*MM;
    const eye=box(24*MM,42*MM,28*MM);eye.position.y=top-21*MM;        // head body around the handle
    const face=cyl(15*MM,44*MM,12);face.rotation.x=Math.PI/2;face.position.set(0,top-21*MM,36*MM);
    g.add(handle,butt,eye,face);
    // split claw, sweeping back off the head and curling down
    [-8*MM,8*MM].forEach(dx=>{
      const a=box(7*MM,12*MM,34*MM);a.position.set(dx,top-16*MM,-26*MM);a.rotation.x=0.22;
      const b=box(7*MM,12*MM,26*MM);b.position.set(dx,top-28*MM,-47*MM);b.rotation.x=0.8;
      g.add(a,b);});
    return g;}
  if(kind==='screw'){const g=new THREE.Group();g.add(cyl(0.11,1.3,12));const hd=cyl(0.26,0.16,14);hd.position.y=0.73;g.add(hd);return g;}
  if(kind==='longscrew'){const g=new THREE.Group();g.add(cyl(0.12,2.6,12));return g;}
  if(kind==='bolt'){const g=new THREE.Group();g.add(cyl(0.14,1.5,12));const hd=cyl(0.3,0.18,14);hd.position.y=0.8;g.add(hd);return g;}
  if(kind==='dowel')return cyl(0.16,1.2,12);
  // 110630: squat barrel, cross recess on top, spiral cam channel round the side
  if(kind==='cam'){
    const g=new THREE.Group();g.add(cyl(0.45,0.68,20));
    const a=box(0.1,0.07,0.5),b=box(0.5,0.07,0.1);
    a.position.y=b.position.y=0.33;a.children[0].material=darkMat;b.children[0].material=darkMat;g.add(a,b);
    const spiral=new THREE.Mesh(new THREE.TorusGeometry(0.46,0.05,6,14,Math.PI*1.1),darkMat);
    spiral.rotation.x=Math.PI/2;spiral.rotation.z=0.5;spiral.position.y=-0.12;g.add(spiral);
    return g;
  }
  // 114670: spoked wheel with a hex socket for the Allen key, on a coiled base
  if(kind==='bigcam'){
    const g=new THREE.Group();
    const rim=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.12,8,22),faceMat);rim.rotation.x=Math.PI/2;rim.position.y=0.18;g.add(rim);
    for(let i=0;i<5;i++){const sp=box(0.6,0.16,0.13);sp.position.set(Math.cos(i*1.2566)*0.31,0.18,Math.sin(i*1.2566)*0.31);sp.rotation.y=-i*1.2566;g.add(sp);}
    const hex=cyl(0.19,0.3,6);hex.position.y=0.22;hex.children[0].material=darkMat;g.add(hex);
    const base=cyl(0.62,0.3,22);base.position.y=-0.18;g.add(base);
    return g;
  }
  // 119030 / 118224: straight slot with a direction arrow, toothed skirt
  if(kind==='drawercam'){
    const g=new THREE.Group();g.add(cyl(0.46,0.5,20));
    const slot=box(0.11,0.07,0.62);slot.position.y=0.24;slot.children[0].material=darkMat;g.add(slot);
    const tip=new THREE.Mesh(new THREE.ConeGeometry(0.11,0.16,10),darkMat);tip.rotation.x=Math.PI/2;tip.position.set(0,0.25,0.36);g.add(tip);
    const teeth=cyl(0.47,0.14,20);teeth.position.y=-0.22;teeth.children[0].material=darkMat;g.add(teeth);
    return g;
  }
  if(kind==='sleeve'){const g=new THREE.Group();const b=box(0.6,0.5,0.6),lip=box(0.6,0.2,0.22);lip.position.set(0,0.3,0.36);g.add(b,lip);return g;}
  if(kind==='cap'){const g=new THREE.Group();const b=box(0.6,0.34,0.28);g.add(b);const p1=cyl(0.05,0.5,8),p2=cyl(0.05,0.5,8);p1.position.set(-0.16,-0.42,0);p2.position.set(0.16,-0.42,0);g.add(p1,p2);return g;}
  if(kind==='cube')return box(0.7,0.7,0.7);
  if(kind==='rail')return box(0.4,0.5,3.6);
  if(kind==='ring'){const g=new THREE.Group();const r=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.13,8,20),faceMat);r.rotation.x=Math.PI/2;g.add(r);g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.CylinderGeometry(0.43,0.43,0.26,20)),lineMat));return g;}
  // driver leg runs along local -Y so its tip lands on the target point; the handle hangs clear
  if(kind==='allen'){const g=new THREE.Group();const drive=box(0.26,2.2,0.26);drive.position.y=0.38;const handle=box(2.4,0.26,0.26);handle.position.set(1.2,1.48,0);g.add(drive,handle);return g;}
  if(kind==='lbracket'){const g=new THREE.Group();const a=box(0.75,0.14,0.55),b=box(0.14,0.75,0.55);a.position.set(0,-0.3,0);b.position.set(-0.3,0.06,0);g.add(a,b);return g;}
  if(kind==='panel')return box(3,1.4,0.22);
  return box(0.6,0.6,0.6);
}

// ================= MODEL: BRIMNES =================
function buildBrimnes(){
  const P={};
  const W=16,L=21,H=4,t=0.5;
  function reg(key,obj,size,pos,name){obj.position.set(pos[0],pos[1],pos[2]);obj.visible=false;content.add(obj);P[key]={obj,size,pos:V(pos[0],pos[1],pos[2]),name};}
  reg('CL',box(t,H,L-1),[t,H,L-1],[-2.4,H/2,0],'Centre panel CL');
  reg('CR',box(t,H,L-1),[t,H,L-1],[2.4,H/2,0],'Centre panel CR');

// Built to AA-472482-3, the 90 × 55 × 45 cm version. Everything is true scale at
// 1 world unit = 50 mm, so the fittings really are as small as they look.
function buildLack(){
  const P={};
  const CM=1/5;                                    // centimetres -> world units
  const topW=90*CM,topD=55*CM,topT=5*CM;           // table top 90 × 55 × 5 cm
  const legS=5*CM,legH=40*CM;                      // legs 5 × 5 × 40 cm, flush with the corners
  const legX=topW/2-legS/2,legZ=topD/2-legS/2;
  const topY=legH+topT/2;
  const shelfT=2*CM,shelfTop=25*CM;                // shelf sits 25 cm off the floor
  const shelfY=shelfTop-shelfT/2,shelfBot=shelfTop-shelfT;
  // The shelf only has to clear the legs across the depth — along the length it runs
  // past them, which is what the bracket arms (centred on each leg) sit under.
  const shelfW=88*CM,shelfD=topD-2*legS;           // 88 × 45 cm
  const faceX=legX-legS/2,faceZ=legZ-legS/2;       // inner faces of the legs
  const markY=shelfBot-9.5*MM;                     // bracket screw sits 14 mm below the shelf
  const LEGS=[[-1,1],[1,1],[-1,-1],[1,-1]];        // sx, sz per leg
  const legKey=(sx,sz)=>'leg'+(sz>0?'F':'B')+(sx<0?'L':'R');

  function reg(key,obj,size,pos,name,o){o=o||{};obj.position.set(pos[0],pos[1],pos[2]);if(o.rotY)obj.rotation.y=o.rotY;obj.visible=false;content.add(obj);
    P[key]={obj,size,pos:V(pos[0],pos[1],pos[2]),name,rotY:o.rotY||0,enter:o.enter,spin:o.spin};}
  reg('top',box(topW,topT,topD),[topW,topT,topD],[0,topY,0],'Table top');
  // Legs thread onto the studs from underneath: they rise into place and turn on, rather
  // than dropping through the table top.
  LEGS.forEach(([sx,sz])=>reg(legKey(sx,sz),box(legS,legH,legS),[legS,legH,legS],[sx*legX,legH/2,sz*legZ],'Leg',{enter:-5,spin:Math.PI*3}));
  reg('shelf',box(shelfW,shelfT,shelfD),[shelfW,shelfT,shelfD],[0,shelfY,0],'Lower shelf');
  // Brackets: tab against the inner face of the leg, slotted arm reaching in under the shelf.
  LEGS.forEach(([sx,sz])=>reg('brk'+(sz>0?'F':'B')+(sx<0?'L':'R'),bracket120298(),[20*MM,17*MM,20*MM],[sx*legX,shelfBot,sz*faceZ],'Angle bracket 120298',{rotY:sz>0?Math.PI:0}));
  // The single template, shown on both legs of a side at once — in reality you move it from one to the other.
  LEGS.forEach(([sx,sz])=>reg('tmpl'+(sz>0?'F':'B')+(sx<0?'L':'R'),template120938(),[26*MM,TMPL_LEN,4*MM],[sx*legX,0,sz*faceZ],'Marking template 120938',{rotY:sz>0?Math.PI:0}));

  const S=[];
  S[0]={name:'Parts, fittings & tools — actual size',txt:'Everything is drawn true to scale (1 grid square = 10 cm), so you can see how small the fittings really are. Scroll to zoom in and the labels open up as room allows. Tools: a screwdriver, a hammer and an awl. Work on a soft surface such as carpet so you do not scratch the table top.',it:[]};
  const st=(n,name,txt,it)=>{S[n]={name,txt,it};};
  const F=(k,c,p,nm)=>({kind:k,qty:c,part:p,name:nm});
  st(1,'Double-ended screws into the top','Turn 4 double-ended screws 115980 by hand into the corner holes on the underside of the table top, until the collar in the middle meets the wood. Roughly half the screw stays proud.',[F('s115980',4,'115980','Double-ended screw')]);
  st(2,'Turn the 4 legs on','Stand each leg over a protruding screw and turn the leg — not the screw — until it pulls up tight against the table top.',[F('panel',4,'','Leg')]);
  st(3,'Mark 2 legs with the template','Tip the table onto its side. Hook template 120938 over the free end of a leg, press it flat against the inner face, and punch a single mark through the small hole with the awl. Lift the template off and repeat on the second leg of the same side.',[F('t120938',1,'120938','Marking template'),F('awl',1,'','Awl — 1 mark per leg')]);
  st(4,'2 brackets on the marked legs','Sit bracket 120298 on the mark with its slotted arm pointing in under the future shelf, and drive screw 108530 through the small round tab hole into the leg. Use 108530 here — the shorter 109041 is for step 8.',[F('b120298',2,'120298','Angle bracket'),F('s108530',2,'108530','Screw')]);
  st(5,'Mark the other 2 legs','Move the same template to the two legs on the opposite long side and mark each one the same way.',[F('t120938',1,'120938','Marking template'),F('awl',1,'','Awl — 1 mark per leg')]);
  st(6,'2 brackets on those legs','Fit the remaining 2 brackets 120298 with the last 2 screws 108530.',[F('b120298',2,'120298','Angle bracket'),F('s108530',2,'108530','Screw')]);
  st(7,'Drop the shelf onto the brackets','Angle the shelf panel in between the legs and swing it down so it lands flat on all 4 bracket arms. Nothing is fastened yet.',[F('panel',1,'','Lower shelf')]);
  st(8,'4 screws up into the shelf','From underneath, drive screw 109041 up through the oval slot in each bracket arm into the shelf — all 4 corners. The slot lets you nudge the shelf square before it bites.',[F('s109041',4,'109041','Screw')]);

  function fx(n){
    const g=[];const G=(kind,part,marks)=>marks.length&&g.push({kind,part,marks});
    const side=sz=>LEGS.filter(l=>l[1]===sz);

      case 1:G('s115980','115980',LEGS.map(([sx,sz])=>mk(sx*legX,legH,sz*legZ,0,1,0)));break;

      case 3:G('awl','',side(1).map(([sx,sz])=>mk(sx*legX,markY,sz*faceZ,0,0,sz)));break;

      case 5:G('awl','',side(-1).map(([sx,sz])=>mk(sx*legX,markY,sz*faceZ,0,0,sz)));break;
      case 6:G('s108530','108530',side(-1).map(([sx,sz])=>mk(sx*legX,markY,sz*faceZ,0,0,sz)));break;

      case 8:G('s109041','109041',LEGS.map(([sx,sz])=>mk(sx*legX,shelfBot-2.5*MM,sz*(faceZ-11*MM),0,1,0)));break;

    if(n===3){s.add('tmplFL');s.add('tmplFR');}
    if(n===5){s.add('tmplBL');s.add('tmplBR');}

  }

  // ---- parts screen: every item laid out at true scale on a 10 cm grid ----
  const trayLabels=[];
  const put=(obj,pos,text,dy)=>{obj.position.set(pos[0],pos[1],pos[2]);tray.add(obj);if(text)trayLabels.push({anchor:V(pos[0],-0.15,pos[2]),text,dy});};
  // Fittings lie along X; makeFit builds them along their own +Y axis.

  put(box(topW,topT,topD),[-7,topT/2,-5],'Table top <code>×1</code>');

  [0,1,2,3].forEach(i=>{const l=box(legS,legS,legH);l.position.set(7.2+i*1.4,legS/2,-5);tray.add(l);});
  trayLabels.push({anchor:V(9.3,-0.15,-0.6),text:'Leg <code>×4</code>'});
  // The four fittings stay clustered so the close-up can show them together, 1:1,

  const bar=box(2,0.07,0.16);bar.children[0].material=hlMat;put(bar,[6.4,0.035,3.3],'10 cm — for scale',-4);
  lay('s115980',[6.4,3*MM,4.4],'Double-ended screw <code>115980</code> <code>×4</code>',24);
  lay('s108530',[6.4,2.5*MM,5.3],'Screw <code>108530</code> <code>×4</code>',48);
  lay('s109041',[6.4,2.1*MM,6.2],'Screw <code>109041</code> <code>×4</code>',72);
  put(bracket120298(),[6.4,17*MM,7.1],'Angle bracket <code>120298</code> <code>×4</code>',96);
  const tmpl=new THREE.Group(),tmplInner=template120938();
  tmplInner.rotation.x=Math.PI/2;tmpl.add(tmplInner);tmpl.rotation.y=Math.PI/2;
  put(tmpl,[6.4,4*MM,11],'Marking template <code>120938</code> — a tool, it does not stay on the table <code>×1</code>');
  ['driver','hammer','awl'].forEach((k,i)=>{const t=makeFit(k);t.rotation.z=Math.PI/2;t.position.set(-7+i*7,0.3,14.5);tray.add(t);});
  trayLabels.push({anchor:V(0,-0.15,15.8),text:'You supply: screwdriver · hammer · awl'});
  const gp=[];
  for(let i=-6;i<=8;i++)gp.push(-17,0,i*2,12,0,i*2);
  for(let i=-8;i<=6;i++)gp.push(i*2,0,-12,i*2,0,16);
  tray.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(gp,3)),new THREE.LineBasicMaterial({color:0x141414,transparent:true,opacity:0.16})));

  const cheers={1:{m:"Off to a great start!",p:'wave'},4:{m:"First brackets on. Nice!",p:'thumbsUp'},7:{m:"Shelf's in — looking good!",p:'happy'}};
  return {name:'LACK coffee table 90×55',count:8,P,steps:S,fx,vis,trayLabels,trayY:1,trayHalf:17,trayCenter:V(-2.5,1,2),
    trayDetail:{at:V(6.4,0.12,5.2),half:2.2,label:'fittings & 10 cm bar, 1:1'},autoAnn:true,
    dh:{1:1.25,3:0.85,4:0.55,5:0.85,6:0.55,8:0.6},
    // Hand-picked close-up angles: the generic broadside guess ends up looking straight
    // through a leg or the table top for most of these.
    ia:{1:{th:2.61,ph:2.15},3:{th:3.93,ph:1.12},4:{th:3.93,ph:1.05},5:{th:2.36,ph:1.12},6:{th:2.36,ph:1.05},8:{th:5.50,ph:2.02}},

}

function orbit(cam,center,half,aspect,th,ph,pX,pY){
  const R=80;
  cam.position.set(center.x+R*Math.sin(ph)*Math.cos(th),center.y+R*Math.cos(ph),center.z+R*Math.sin(ph)*Math.sin(th));
  cam.up.set(0,1,0);cam.lookAt(center);

  cam.left=-half*aspect+dx;cam.right=half*aspect+dx;cam.top=half+dy;cam.bottom=-half+dy;cam.updateProjectionMatrix();
}
// Put the close-up camera on the side the fastener comes FROM (along -dir), otherwise
// the inset looks through the workpiece at a fastener hidden behind it.
function insetAngles(d){
  const ax=Math.abs(d.x),ay=Math.abs(d.y),az=Math.abs(d.z);
  if(ay>=ax&&ay>=az)return{th:0.9,ph:d.y<0?0.95:2.19};  // driven up -> look up from below

  return{th:d.x<0?1.28:Math.PI-1.28,ph:0.95};
}

// fitting itself so a 15 mm screw is not swallowed by its own highlight in the close-up.
function buildFits(n,annBig){
  while(fitGroup.children.length)fitGroup.remove(fitGroup.children[0]);
  markers=[];arrows=[];
  const groups=MODEL.fx(n);let i=0;
  groups.forEach(gr=>gr.marks.forEach(m=>{
    const p=V(m.pos[0],m.pos[1],m.pos[2]);
    const nd=V(m.dir[0],m.dir[1],m.dir[2]).normalize();
    const out=nd.clone().multiplyScalar(-1);
    const L=fitLen(gr.kind);
    const hole=new THREE.Mesh(new THREE.CircleGeometry(HOLE_R[gr.kind]||0.15,16),holeMat);
    hole.quaternion.setFromUnitVectors(ZAX,out);hole.position.copy(p).addScaledVector(out,0.012);hole.renderOrder=1;fitGroup.add(hole);
    if(i>=FULL_MARKS){i++;return;}   // beyond this, the hole alone marks the position
    const fit=makeFit(gr.kind);const q0=new THREE.Quaternion().setFromUnitVectors(UP,out);
    fit.quaternion.copy(q0);fit.userData={p,out,ph:i*0.5,kind:gr.kind,press:!!gr.press,q0,L};fitGroup.add(fit);markers.push(fit);
    const ann=(a,layer)=>{
      const ring=new THREE.Mesh(new THREE.RingGeometry(0.32*a,0.52*a,20),hlMat);ring.quaternion.setFromUnitVectors(ZAX,nd);
      ring.position.copy(p).addScaledVector(out,0.006);ring.renderOrder=2;ring.layers.set(layer);fitGroup.add(ring);
      const cone=new THREE.Mesh(new THREE.CylinderGeometry(0,0.17*a,0.52*a,14),hlMat);cone.quaternion.setFromUnitVectors(UP,nd);cone.layers.set(layer);
      cone.userData={p,out,base:L+0.5*a,bob:0.3*a};fitGroup.add(cone);arrows.push(cone);
    };
    ann(MODEL.autoAnn?annBig:1,1);
    // in the close-up the ring should hug the shank, so size it off the hole, not the view
    ann(MODEL.autoAnn?(HOLE_R[gr.kind]||0.15)*3.4:1,2);
    i++;
  }));
  return groups;
}

// ---------- framing ----------
function focusFor(n,before){
  let pts=MODEL.fx(n).flatMap(g=>g.marks).map(m=>V(m.pos[0],m.pos[1],m.pos[2]));
  const primary=pts[0];
  if(!pts.length){
    const ks=[...MODEL.vis(n)].filter(k=>!before.has(k));
    ks.forEach(k=>{const o=P[k];if(!o)return;const[sx,sy,sz]=o.size;pts.push(o.pos.clone());pts.push(o.pos.clone().add(V(sx/2,sy/2,sz/2)));pts.push(o.pos.clone().add(V(-sx/2,-sy/2,-sz/2)));});
  }
  if(!pts.length){[...MODEL.vis(n)].forEach(k=>{const o=P[k];if(!o)return;const[sx,sy,sz]=o.size;pts.push(o.pos.clone());pts.push(o.pos.clone().add(V(sx/2,sy/2,sz/2)));pts.push(o.pos.clone().add(V(-sx/2,-sy/2,-sz/2)));});}
  if(!pts.length)pts=[V(0,2,0)];
  const c=V(0,0,0);pts.forEach(p=>c.add(p));c.multiplyScalar(1/pts.length);
  let r=0;pts.forEach(p=>r=Math.max(r,p.distanceTo(c)));r=Math.max(r,1);
  // extent of everything on screen, so framing can be expressed relative to the
  // assembly instead of the fixed 5/19 clamps (which crop or shrink at the extremes)
  const wp=[];[...MODEL.vis(n)].forEach(k=>{const o=P[k];if(!o)return;const[sx,sy,sz]=o.size;
    wp.push(o.pos.clone(),o.pos.clone().add(V(sx/2,sy/2,sz/2)),o.pos.clone().add(V(-sx/2,-sy/2,-sz/2)));});
  const wc=V(0,0,0);wp.forEach(p=>wc.add(p));if(wp.length)wc.multiplyScalar(1/wp.length);
  let wr=1;wp.forEach(p=>wr=Math.max(wr,p.distanceTo(wc)));
  return{center:c,radius:r,primary:primary||c,whole:wr};
}

// ---------- leaders / labels ----------
const leads=document.getElementById('leads'),lead=document.getElementById('lead'),target=document.getElementById('target');
const cntEl=document.getElementById('cnt'),legendEl=document.getElementById('legend'),detailLabel=document.getElementById('detaillabel');
let primaryMarker=null;
function updateLeader(){
  const show=calloutOn&&primaryMarker;
  insetC.style.display=show?'block':'none';
  document.getElementById('detailtag').style.display=show?'block':'none';
  leads.style.display=show?'block':'none';
  if(!show)return;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const v=primaryMarker.clone().project(camera);
  const x=(v.x*0.5+0.5)*w,y=(-v.y*0.5+0.5)*h;
  const size=insetC.clientWidth,margin=16;
  const cx=w-margin-size/2,cy=52+size/2;
  target.setAttribute('cx',x);target.setAttribute('cy',y);
  lead.setAttribute('x1',cx);lead.setAttribute('y1',cy+size/2-6);lead.setAttribute('x2',x);lead.setAttribute('y2',y);
}
const trayLabelPool=[];
function positionTrayLabels(){
  if(idx!==0||!labelsOn){trayLabelPool.forEach(d=>d.style.display='none');return;}
  const w=canvas.clientWidth,h=canvas.clientHeight,labels=MODEL.trayLabels;
  while(trayLabelPool.length<labels.length){const d=document.createElement('div');d.className='chip tag';d.style.position='absolute';d.style.transform='translate(-50%,0)';leads.parentElement.appendChild(d);trayLabelPool.push(d);}
  const live=[];
  labels.forEach((l,i)=>{const d=trayLabelPool[i];
    if(d.dataset.txt!==l.text){d.dataset.txt=l.text;d.innerHTML='<span class="tdot"></span>'+l.text;
      d.style.display='flex';l.ew=d.offsetWidth;l.eh=d.offsetHeight;}
    const v=l.anchor.clone().project(camera);if(v.z>1){d.style.display='none';return;}
    live.push({d,l,x:(v.x*0.5+0.5)*w+(l.dx||0),y:(-v.y*0.5+0.5)*h+8+(l.dy||0)});});
  // Show a label whenever it fits without touching one already placed, working outwards
  // from the middle of the view — so zooming into a cluster is what reveals its labels.
  const mx=w/2,my=h*0.45;
  live.sort((a,b)=>Math.hypot(a.x-mx,a.y-my)-Math.hypot(b.x-mx,b.y-my));
  const placed=[];
  live.forEach(c=>{
    const r={x0:c.x-c.l.ew/2,x1:c.x+c.l.ew/2,y0:c.y,y1:c.y+c.l.eh};
    // Must sit wholly inside the canvas: a label half off the edge is unreadable, and
    // one hanging past the bottom would cover the step caption.
    if(r.x0<4||r.x1>w-4||r.y0<4||r.y1>h-4){c.d.style.display='none';return;}
    if(placed.some(p=>p.x0<r.x1+6&&r.x0<p.x1+6&&p.y0<r.y1+4&&r.y0<p.y1+4)){c.d.style.display='none';return;}
    placed.push(r);
    c.d.style.display='flex';c.d.style.zIndex=5;c.d.style.left=c.x+'px';c.d.style.top=c.y+'px';
  });
}

// ---------- animation ----------
const clock=new THREE.Clock();
let stepT0=0,newParts=[],stepDur=0.7;
const _qs=new THREE.Quaternion();
function ease(u){return u<0?0:u>1?1:u*u*(3-2*u);}
// Direction a newly-visible part travels in from. The manual shows horizontal slides
// and pushes as often as drops; a blanket +Y drop misreads those steps.
function entryOffset(n,it){
  if(it.enter!==undefined)return V(0,it.enter,0);   // per-part override, e.g. legs rise from below
  const e=MODEL.entry&&MODEL.entry[n];
  if(!e)return V(0,6,0);
  const v=V(e[0],e[1],e[2]);
  const along=e[0]?it.pos.x:e[2]?it.pos.z:0;
  if(along<0)v.negate();          // parts left of centre come in from the left
  return v.multiplyScalar(6);
}
function loop(){
  const tt=clock.getElapsedTime();
  if(spinOn&&!dragging&&!REDUCED)theta+=0.0016;
  halfTarget=baseHalf/userZoom;
  camCenter.lerp(camTarget,0.12);iCenter.lerp(iTarget,0.14);
  halfView+=(halfTarget-halfView)*0.12;iHalf+=(iHalfTarget-iHalf)*0.14;
  resize();
  const prog=ease((tt-stepT0)/stepDur);
  newParts.forEach(k=>{const it=P[k];if(!it)return;
    it.obj.position.copy(it.pos).addScaledVector(entryOffset(idx,it),1-prog);
    if(it.spin)it.obj.rotation.y=it.rotY+it.spin*(1-prog);});
  if(MODEL.motion)MODEL.motion(idx,prog);
  markers.forEach(m=>{
    const{p,out,ph,kind,press,q0,L}=m.userData;
    const bob=REDUCED?0:Math.max(0,Math.sin(tt*2+ph)*L*0.046);
    m.position.copy(p).addScaledVector(out,L*0.5+0.02+(1-prog)*L*1.23+bob);
    let a=0;
    if(!press&&SPIN[kind])a=REDUCED?prog*Math.PI*2:tt*4.2+ph;
    else if(!press&&LOCK[kind])a=ease((prog-0.55)/0.45)*Math.PI/2;
    m.quaternion.copy(q0);
    if(a)m.quaternion.multiply(_qs.setFromAxisAngle(UP,a));
  });
  arrows.forEach(a=>{const{p,out,base,bob}=a.userData;const b=REDUCED?0:(Math.sin(tt*2.4)*0.5+0.5)*bob;a.position.copy(p).addScaledVector(out,base+b);a.visible=prog>0.15;});
  positionTrayLabels();
  const show=calloutOn&&primaryMarker;
  // servo the pan so the target lands on a fixed anchor left of centre; a constant
  // offset lets the marker drift under the opaque inset once the user rotates
  if(show&&idx!==0){const v=primaryMarker.clone().project(camera);
    panXTarget=Math.max(-0.9,Math.min(0.9,panX+(v.x-ANCHOR_X)));
    panYTarget=Math.max(-0.9,Math.min(0.9,panY+(v.y-ANCHOR_Y)));}
  else{panXTarget=0;panYTarget=0;}
  panX+=(panXTarget-panX)*0.12;panY+=(panYTarget-panY)*0.12;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  orbit(camera,camCenter,halfView,w/h,theta,phi,panX,panY);renderer.render(scene,camera);
  if(show){orbit(camI,iCenter,iHalf,1,iTheta,iPhi,0,0);insetR.render(scene,camI);}
  updateLeader();
  requestAnimationFrame(loop);
}

// ---------- UI ----------
const stepnoEl=document.getElementById('stepno'),nameEl=document.getElementById('cname'),txtEl=document.getElementById('ctxt'),
 prevB=document.getElementById('prev'),nextB=document.getElementById('next'),playB=document.getElementById('play'),
 spinB=document.getElementById('spin'),detailB=document.getElementById('detail'),slider=document.getElementById('slider'),
 titleEl=document.getElementById('title'),modelSel=document.getElementById('modelsel');
// Reset to rest pose first, so a part left mid-flight by fast step-skipping never sticks.
function setVis(n){for(const k in P){const it=P[k];it.obj.visible=false;it.obj.position.copy(it.pos);if(it.spin)it.obj.rotation.y=it.rotY;}
  MODEL.vis(n).forEach(k=>{if(P[k])P[k].obj.visible=true;});}
// ---------- the encouraging IKEA guy ----------
const buddyEl=document.getElementById('buddy'),speechEl=document.getElementById('speech'),guyEl=document.getElementById('guy');
function buddySVG(pose){
  const arms={
    happy:'<rect x="14" y="84" width="12" height="50" rx="6" transform="rotate(14 20 88)"/><circle cx="17" cy="136" r="7"/><rect x="94" y="84" width="12" height="50" rx="6" transform="rotate(-14 100 88)"/><circle cx="103" cy="136" r="7"/>',
    thumbsUp:'<rect x="16" y="84" width="12" height="50" rx="6" transform="rotate(14 22 88)"/><circle cx="19" cy="136" r="7"/><rect x="86" y="30" width="12" height="56" rx="6" transform="rotate(22 92 86)"/><circle cx="99" cy="30" r="8"/>',
    wave:'<rect x="16" y="84" width="12" height="50" rx="6" transform="rotate(14 22 88)"/><circle cx="19" cy="136" r="7"/><rect x="88" y="24" width="12" height="58" rx="6" transform="rotate(-18 94 82)"/><circle cx="86" cy="26" r="8"/>',
    celebrate:'<rect x="20" y="24" width="12" height="60" rx="6" transform="rotate(-28 26 84)"/><circle cx="12" cy="26" r="8"/><rect x="88" y="24" width="12" height="60" rx="6" transform="rotate(28 94 84)"/><circle cx="108" cy="26" r="8"/>'
  };
  const spark=pose==='celebrate'?'<g stroke-width="3"><path d="M6 58 l0 11 M1 63.5 l11 0"/><path d="M114 54 l0 11 M108.5 59.5 l11 0"/><path d="M100 6 l0 9 M95.5 10.5 l9 0"/></g>':'';
  return '<svg viewBox="0 0 120 210" fill="#fff" stroke="#141414" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">'
    +'<rect x="45" y="150" width="12" height="52" rx="5"/><rect x="63" y="150" width="12" height="52" rx="5"/>'
    +(arms[pose]||arms.happy)
    +'<path d="M60 64 C30 66 18 92 30 118 C34 132 45 134 47 158 L73 158 C75 134 86 132 90 118 C102 92 90 66 60 64 Z"/>'
    +'<ellipse cx="58" cy="40" rx="25" ry="27"/><path d="M79 30 L94 33 L82 45 Z"/>'
    +'<circle cx="52" cy="38" r="3" fill="#141414" stroke="none"/><circle cx="64" cy="38" r="3" fill="#141414" stroke="none"/>'
    +'<path d="M49 50 Q58 60 70 49" fill="none" stroke-width="3.5"/>'+spark+'</svg>';
}
function updateBuddy(n){
  const finish=n===MODEL.count&&MODEL.finish;
  const cheer=!finish&&MODEL.cheers&&MODEL.cheers[n];
  if(finish){guyEl.innerHTML=buddySVG('celebrate');speechEl.textContent=MODEL.finish;buddyEl.classList.add('show','big');}
  else if(cheer){guyEl.innerHTML=buddySVG(cheer.p);speechEl.textContent=cheer.m;buddyEl.classList.add('show');buddyEl.classList.remove('big');}
  else buddyEl.classList.remove('show','big');
}
function buildLegend(step){legendEl.innerHTML='';(step.it||[]).forEach(it=>{const c=document.createElement('div');c.className='chip';c.innerHTML='<span class="dot"></span><span class="q">'+(it.qty>1?it.qty+'× ':'')+'</span>'+it.name+(it.part?' <code>'+it.part+'</code>':'');legendEl.appendChild(c);});}
function go(i){
  const cnt=MODEL.count;idx=Math.max(0,Math.min(cnt,i));userZoom=1;
  const step=MODEL.steps[idx];
  const fin=idx===MODEL.finishedIdx;
  stepnoEl.innerHTML=idx===0?'Parts':(fin?'&#10003;':(idx+'<small>/ '+MODEL.realCount+'</small>'));
  nameEl.textContent=(idx===0||fin)?step.name:(idx+'. '+step.name);
  txtEl.textContent=step.txt;
  // the drawer sub-assembly (38-47) shares no keys with the frame, so stepping back to
  // the bed must not count the whole frame as "new" and drop it from the sky
  const prevIdx=idx-1<0?0:idx-1;
  const before=(MODEL.rejoin&&MODEL.rejoin[idx]!==undefined)?MODEL.vis(MODEL.rejoin[idx]):MODEL.vis(prevIdx);
  setVis(idx);tray.visible=(idx===0);
  newParts=[...MODEL.vis(idx)].filter(k=>!before.has(k)).concat((MODEL.reposition&&MODEL.reposition[idx])||[]);
  stepDur=(MODEL.slow&&MODEL.slow[idx])||0.7;
  stepT0=clock.getElapsedTime();
  buildLegend(step);
  let groups;
  if(idx===0){
    if(MODEL.trayCenter)camTarget.copy(MODEL.trayCenter);else camTarget.set(0,MODEL.trayY,0);
    baseHalf=MODEL.trayHalf||12.5;groups=buildFits(idx,1);
    const td=MODEL.trayDetail;
    if(td){primaryMarker=td.at.clone();iTarget.copy(td.at);iHalfTarget=td.half;iTheta=0.9;iPhi=0.95;cntEl.textContent=td.label;detailLabel.textContent='ACTUAL SIZE';}
    else{primaryMarker=null;cntEl.textContent='';detailLabel.textContent='DETAIL';}
  }
  else{
    detailLabel.textContent='DETAIL';
    const f=focusFor(idx,before);camTarget.copy(f.center);
    baseHalf=Math.min(f.whole*1.05,Math.max(f.whole*0.45,f.radius*1.5+2.2));
    groups=buildFits(idx,MODEL.autoAnn?Math.min(1.6,Math.max(0.4,baseHalf/13)):1);
    const nm=groups.flatMap(g=>g.marks);
    if(nm.length){
      primaryMarker=V(nm[0].pos[0],nm[0].pos[1],nm[0].pos[2]);iTarget.copy(primaryMarker);
      const d0=V(nm[0].dir[0],nm[0].dir[1],nm[0].dir[2]).normalize();
      const ia=(MODEL.ia&&MODEL.ia[idx])||insetAngles(d0);iTheta=ia.th;iPhi=ia.ph;
      // scale the close-up to the fastener, not to the spread of all the markers,
      // otherwise a multi-screw step zooms the "detail" view out to the main view's scale
      iHalfTarget=(MODEL.dh&&MODEL.dh[idx])||(HOLE_R[groups[0].kind]||0.2)*2.6+0.5;
      const first=groups[0];const cap=(step.it||[]).find(x=>x.part&&x.part===first.part)||(step.it||[]).find(x=>x.kind===first.kind);
      const q=cap?cap.qty:first.marks.length;cntEl.textContent=(q>1?q+'× ':'')+first.part;
    }else{primaryMarker=null;cntEl.textContent='';}
  }
  updateBuddy(idx);
  prevB.disabled=idx===0;nextB.disabled=idx===cnt;slider.value=idx;slider.max=cnt;
}
function loadModel(key){
  while(content.children.length)content.remove(content.children[0]);
  while(tray.children.length)tray.remove(tray.children[0]);
  trayLabelPool.forEach(d=>d.remove());trayLabelPool.length=0;
  MODEL=BUILDERS[key]();P=MODEL.P;
  const rc=MODEL.count,fin=rc+1;                       // extra showcase step = fully assembled product
  MODEL.realCount=rc;MODEL.finishedIdx=fin;MODEL.count=fin;
  MODEL.steps[fin]={name:'Finished!',txt:MODEL.finish||'All done — enjoy your new furniture!',it:[]};
  const _vis=MODEL.vis,_fx=MODEL.fx;
  MODEL.vis=n=>n>=fin?_vis(rc):_vis(n);
  MODEL.fx=n=>n>=fin?[]:_fx(n);
  titleEl.textContent=MODEL.name;document.title='IKEA — '+MODEL.name;
  modelSel.value=key;go(0);
}
prevB.onclick=()=>go(idx-1);nextB.onclick=()=>go(idx+1);
slider.oninput=()=>go(+slider.value);
let playing=false,timer=null;
playB.onclick=()=>{playing=!playing;playB.innerHTML=playing?'&#10074;&#10074;':'&#9658;';if(playing)timer=setInterval(()=>go(idx>=MODEL.count?0:idx+1),2800);else clearInterval(timer);};
spinB.onclick=()=>{spinOn=!spinOn;spinB.classList.toggle('active',spinOn);spinB.title='Auto-spin ('+(spinOn?'on':'off')+')';};
detailB.onclick=()=>{calloutOn=!calloutOn;detailB.classList.toggle('active',calloutOn);detailB.title='Close-up detail ('+(calloutOn?'on':'off')+')';};
const labelsB=document.getElementById('labels');
labelsB.onclick=()=>{labelsOn=!labelsOn;labelsB.classList.toggle('active',labelsOn);document.body.classList.toggle('nolabels',!labelsOn);labelsB.title='Item labels ('+(labelsOn?'on':'off')+')';};
modelSel.onchange=()=>{const k=modelSel.value;history.replaceState(null,'','?model='+k);loadModel(k);};

let dragging=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-lx)*0.008;phi-=(e.clientY-ly)*0.008;phi=Math.max(0.22,Math.min(1.46,phi));lx=e.clientX;ly=e.clientY;});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();userZoom*=(e.deltaY>0?0.9:1.1);userZoom=Math.max(0.5,Math.min(3.2,userZoom));},{passive:false});

const startKey=new URLSearchParams(location.search).get('model')==='lack'?'lack':'brimnes';
resize();loadModel(startKey);loop();
</script>
