<!DOCTYPE html>
<html lang="en">
<!-- Source for assets/og.png. Re-render at exactly 1200×630:
     chrome --headless=new --window-size=1200,630 --screenshot=assets/og.png assets/og-source.html -->
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#141414;--paper:#f7f6f3;--muted:#6b6b6b;--hl:#e6502e;--font:"Helvetica Neue",Helvetica,Arial,sans-serif}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--paper);font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--ink);padding:36px}
  .page{position:relative;width:100%;height:100%;background:#fff;border:3px solid var(--ink);border-radius:34px;display:flex;align-items:center;gap:40px;padding:56px 62px}
  .page::before{content:"";position:absolute;inset:13px;border:2px dashed rgba(20,20,20,.35);border-radius:23px}
  .copy{flex:1 1 auto;position:relative}
  .mark{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:800;letter-spacing:2px;color:var(--muted)}
  .mark img{width:44px;height:44px}
  h1{font-size:82px;font-weight:800;letter-spacing:-3px;line-height:1;margin:26px 0 18px}
  p{font-size:25px;color:var(--muted);line-height:1.35;max-width:15em}
  .chips{display:flex;gap:12px;margin-top:32px}
  .chip{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;border:2.5px solid var(--ink);border-radius:26px;padding:8px 20px}
  .chip .dot{width:11px;height:11px;border-radius:50%;background:var(--hl)}
  .art{flex:0 0 400px;display:flex;flex-direction:column;gap:6px}
  .art img{width:100%;height:230px;object-fit:contain}
</style>
</head>
<body>
  <div class="page">
    <div class="copy">
      <div class="mark"><img src="favicon.svg" alt="">ASSEMBLY GUIDES</div>
      <h1>Build it right,<br>step by step.</h1>
      <p>Interactive 3D instructions for IKEA furniture — every part, fitting and screw at true scale.</p>
      <div class="chips">
        <span class="chip"><span class="dot"></span>BRIMNES · 48 steps</span>
        <span class="chip"><span class="dot"></span>LACK · 8 steps</span>
      </div>
    </div>
    <div class="art">
      <img src="brimnes.png" alt="">
      <img src="lack.png" alt="">
    </div>
  </div>
</body>
</html>
