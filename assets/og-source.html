<!DOCTYPE html>
<html lang="en">
<!-- Source for assets/og.png. Re-render at exactly 1200×630:
     chrome --headless=new --window-size=1200,630 --screenshot=assets/og.png assets/og-source.html
     The figure is the same one the viewer cheers you on with, drawn in the manual's line style. -->
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#141414;--paper:#f7f6f3;--muted:#6b6b6b;--hl:#e6502e;--font:"Helvetica Neue",Helvetica,Arial,sans-serif}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--paper);font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--ink);padding:36px}
  .page{position:relative;width:100%;height:100%;background:#fff;border:3px solid var(--ink);border-radius:34px;display:flex;align-items:center;padding:54px 60px;overflow:hidden}
  .page::before{content:"";position:absolute;inset:13px;border:2px dashed rgba(20,20,20,.35);border-radius:23px}
  .copy{position:relative;flex:0 0 470px}
  .mark{display:flex;align-items:center;gap:13px;font-size:15px;font-weight:800;letter-spacing:2.2px;color:var(--muted)}
  .mark img{width:42px;height:42px}
  h1{font-size:74px;font-weight:800;letter-spacing:-2.5px;line-height:1;margin:24px 0 16px}
  p{font-size:23px;color:var(--muted);line-height:1.35}
  .chips{display:flex;gap:11px;margin-top:30px}
  .chip{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;border:2.5px solid var(--ink);border-radius:26px;padding:7px 18px}
  .chip .dot{width:10px;height:10px;border-radius:50%;background:var(--hl)}
  .scene{position:relative;flex:1 1 auto;height:100%}
  .scene svg{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>
<body>
  <div class="page">
    <div class="copy">
      <div class="mark"><img src="favicon.svg" alt="">ASSEMBLY GUIDES</div>
      <h1>The manual,<br>in 3D!</h1>
      <p>Rotate any step.<br>Zoom into any screw.</p>
      <div class="chips">
        <span class="chip"><span class="dot"></span>BRIMNES · 48 steps</span>
        <span class="chip"><span class="dot"></span>LACK · 8 steps</span>
      </div>
    </div>
    <div class="scene"><svg id="scene" viewBox="0 0 600 540" fill="none" stroke="#141414" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></svg></div>
  </div>
<script>
// The figure, its face line and eye are the viewer's buddy in the 'point' pose.
const BODY='M300 30 C232 34 204 104 220 162 C230 212 238 258 240 292'
  +' C150 328 18 402 14 452 C10 502 92 560 150 600 C142 622 136 640 140 650'
  +' C152 664 172 656 178 640 L184 975 L392 975 L580 975 L497 872'
  +' C504 700 502 560 500 470 C580 486 664 480 742 478'
  +' C768 476 768 424 742 422 C650 368 520 320 400 268'
  +' L408 152 L462 136 C438 66 366 28 300 30 Z';
const FACE='M268 92 C246 160 288 214 352 212 C392 210 404 190 408 152';
// A board in the manual's projection: length runs up-right, width down-right, thickness straight down.
const U=[0.951,-0.309],W=[0.940,0.342];
function plank(x,y,len,wid,th){
  const p=(a,b)=>[x+U[0]*a+W[0]*b,y+U[1]*a+W[1]*b];
  const A=p(0,0),B=p(len,0),C=p(len,wid),D=p(0,wid);
  const dn=q=>[q[0],q[1]+th],f=pts=>'M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+'Z';
  return '<g fill="#fff">'
    +'<path d="'+f([D,C,dn(C),dn(D)])+'"/>'      // long face
    +'<path d="'+f([B,C,dn(C),dn(B)])+'"/>'      // end grain
    +'<path d="'+f([A,B,C,D])+'"/></g>';         // top, drawn last so it sits over both
}
document.getElementById('scene').innerHTML=
  // two boards laid out mid-build, the way the manual shows a part before it goes on
  plank(250,352,260,84,26)
  +plank(230,430,210,74,24)
  // the figure, scaled so he stands about two thirds of the frame tall
  +'<g transform="translate(-10 50) scale(0.44)" stroke-width="20">'
    +'<path fill="#fff" d="'+BODY+'"/><path d="'+FACE+'"/><path d="M388 706 L388 975"/>'
    +'<circle cx="360" cy="100" r="15" fill="#141414" stroke="none"/>'
  +'</g>'
  // the manual he is puzzling over, held open at the end of his outstretched arm
  +'<g fill="#fff"><path d="M278 186 L336 214 L336 302 L278 270 Z"/>'
    +'<path d="M394 186 L336 214 L336 302 L394 270 Z"/></g>'
  +'<g stroke-width="6"><path d="M350 244 L382 228 M350 268 L382 252"/></g>'
  // thought bubble, rising from his head towards the top right corner
  +'<g fill="#fff"><circle cx="208" cy="60" r="9"/><circle cx="258" cy="48" r="13"/><circle cx="346" cy="56" r="50"/></g>'
  +'<text x="346" y="79" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial" font-size="68" font-weight="700" fill="#141414" stroke="none">?</text>';
</script>
</body>
</html>
