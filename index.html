<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKEA 3D assembly — choose a product</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#141414;--paper:#f7f6f3;--muted:#6b6b6b;--font:"Helvetica Neue",Helvetica,Arial,sans-serif}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
  .wrap{width:100%;max-width:820px}
  .head{text-align:center;margin-bottom:26px}
  .head h1{font-size:34px;font-weight:800;letter-spacing:-1px}
  .head p{color:var(--muted);font-size:14px;margin-top:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
  a.card{display:block;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:22px;overflow:hidden;position:relative;transition:transform .12s,box-shadow .12s}
  a.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.12)}
  a.card::before{content:"";position:absolute;inset:8px;border:1.5px dashed rgba(20,20,20,.3);border-radius:15px;pointer-events:none}
  .art{height:190px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--ink);background:#fff}
  .art svg{width:78%;height:78%}
  .art img{width:100%;height:100%;object-fit:contain;padding:14px}
  .meta{padding:14px 18px 18px}
  .meta .name{font-size:20px;font-weight:800}
  .meta .sub{font-size:13px;color:var(--muted);margin-top:3px}
  .meta .steps{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:20px;padding:3px 12px}
  .foot{text-align:center;color:#b3b3ad;font-size:12px;margin-top:22px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Assembly guides</h1>
      <p>Pick a product to open its interactive step-by-step 3D instructions.</p>
    </div>
    <div class="grid">
      <a class="card" href="viewer.html?model=brimnes">
        <div class="art"><img src="assets/brimnes.png" alt="BRIMNES bed frame with storage"></div>
        <div class="meta"><div class="name">BRIMNES</div><div class="sub">Bed frame with storage</div><span class="steps">48 steps</span></div>
      </a>
      <a class="card" href="viewer.html?model=lack">
        <div class="art"><img src="assets/lack.png" alt="LACK coffee table"></div>
        <div class="meta"><div class="name">LACK</div><div class="sub">Coffee table with shelf</div><span class="steps">8 steps</span></div>
      </a>
    </div>
    <div class="foot">Drag to rotate · scroll to zoom · toggle the close-up detail circle for each fastener</div>
  </div>
</body>
</html>
